name: Feature request
description: Suggest an improvement to one of the Romano Assets kits.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which kit is this for?
      options:
        - All In One Prefab Builder Kit
        - All In One Interaction Kit
        - All In One Save Kit
        - All In One Game Settings & Menu Kit
        - All In One Runtime Building Kit
        - All In One Bug Report Kit
        - All In One Surface Footstep Kit
        - All In One Tutorial Kit
        - All In One Hit Feedback Kit
        - All In One Waypoint & Minimap Kit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
      description: What are you trying to do, and what makes it hard with the kit today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: Describe the change you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you have considered.
    validations:
      required: false
